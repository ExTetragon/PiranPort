plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// Allows verification beside an IDE/game that still holds the normal outputs open.
if (providers.gradleProperty('buildOutput').isPresent()) {
    layout.buildDirectory.set(layout.projectDirectory.dir(providers.gradleProperty('buildOutput').get()))
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel")
    exclude("**/.cache/**")
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21 to end users, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Access Transformers are automatically detected; uncomment to point at a custom file.
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // 框架详细日志显式启用，模组调试信息由公共配置独立控制。
            if (providers.gradleProperty('verboseGameLogging').map { it.toBoolean() }.getOrElse(false)) {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            } else {
                logLevel = org.slf4j.event.Level.INFO
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Optional runtime-only dependencies that should not be published.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI example:
    // compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// 本地验证显式启用，普通构建不依赖仓库外的测试或工具。
if (providers.gradleProperty('withLocalTests').map { it.toBoolean() }.getOrElse(false)) {
    def localTests = file(providers.gradleProperty('localTestRoot').getOrElse("../dev/${projectDir.name}"))
    def acceptanceScript = new File(localTests, 'acceptance.gradle')
    if (!acceptanceScript.isFile()) {
        throw new GradleException("Local tests are missing: ${acceptanceScript}. Restore the local dev directory or omit -PwithLocalTests=true.")
    }
    ext.localAcceptanceDir = localTests
    apply from: acceptanceScript
}
