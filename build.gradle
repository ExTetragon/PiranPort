plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// Allows verification beside an IDE/game that still holds the normal outputs open.
if (providers.gradleProperty('buildOutput').isPresent()) {
    layout.buildDirectory.set(layout.projectDirectory.dir(providers.gradleProperty('buildOutput').get()))
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel")
    exclude("**/.cache/**")
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21 to end users, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gameTest
}
sourceSets.gameTest.compileClasspath += sourceSets.main.output
sourceSets.gameTest.runtimeClasspath += sourceSets.main.output

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Access Transformers are automatically detected; uncomment to point at a custom file.
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs all registered gametests, then exits.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = file("run/gametest")
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        worldgenAcceptance {
            server()
            gameDirectory = file(providers.gradleProperty('acceptanceWorldDir').getOrElse('run/acceptance-worldgen'))
            programArgument '--nogui'
            systemProperty 'piranport.acceptance.worldgen', 'true'
            systemProperty 'piranport.acceptance.worldgenReport', layout.buildDirectory.file('reports/acceptance/worldgen.json').get().asFile.absolutePath
        }

        acceptanceClient {
            client()
            gameDirectory = file('run/acceptance-client')
            systemProperty 'piranport.acceptance.clientSmoke', providers.gradleProperty('acceptanceClientSmoke').getOrElse('false')
        }

        shipyardUiClient {
            client()
            gameDirectory = file('run/shipyard-ui-client')
            programArguments.addAll '--width', '1280', '--height', '900'
            systemProperty 'piranport.acceptance.shipyardUi', 'true'
            systemProperty 'piranport.acceptance.shipyardUiReport', layout.buildDirectory.dir('reports/shipyard-ui').get().asFile.absolutePath
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            // 框架详细日志显式启用，模组调试信息由公共配置独立控制。
            if (providers.gradleProperty('verboseGameLogging').map { it.toBoolean() }.getOrElse(false)) {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.DEBUG
            } else {
                logLevel = org.slf4j.event.Level.INFO
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

// Optional runtime-only dependencies that should not be published.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    // JEI example:
    // compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Compile the in-game regressions during build; execute them with runGameTestServer.
tasks.named("check") { dependsOn tasks.named("gameTestClasses") }

// Isolated natural world generation using the normal NeoForge development server.
tasks.named('runWorldgenAcceptance') {
    doFirst {
        def target = file(providers.gradleProperty('acceptanceWorldDir').getOrElse('run/acceptance-worldgen'))
        target.mkdirs()
        def props = new File(target, 'server.properties')
        if (!props.exists()) props.text = '''level-seed=20261022
level-name=world
server-ip=127.0.0.1
server-port=0
online-mode=false
max-tick-time=-1
spawn-protection=0
view-distance=2
simulation-distance=2
'''
    }
}
